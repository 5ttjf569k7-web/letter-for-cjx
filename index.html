<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>给你的一封信</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#5a4a42;background:#bfe6ff;-webkit-user-select:none;user-select:none}

/* ========== 背景：蓝天 · 云 · 太阳 · 草坪 ========== */
.bg{position:fixed;left:0;top:0;right:0;bottom:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#57b6f5 0%,#86cdfb 32%,#c6eaff 60%,#eaf8ff 74%)}
.sun{position:absolute;top:5%;right:9%;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,#fffcd2 0%,#ffe97a 55%,rgba(255,233,122,0) 72%);animation:pulse 4.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.cloud{position:absolute;height:22px;background:#fff;border-radius:22px;opacity:.95}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{left:14px;top:-12px;width:26px;height:26px}
.cloud:after{right:16px;top:-18px;width:36px;height:36px}
.c1{width:74px;top:8%;animation:drift 30s linear infinite}
.c2{width:54px;top:19%;opacity:.8;animation:drift 42s linear infinite 5s}
.c3{width:90px;top:30%;opacity:.7;animation:drift 54s linear infinite 12s}
@keyframes drift{0%{left:-45%}100%{left:115%}}
.grass{position:fixed;left:-6%;right:-6%;bottom:0;height:26%;z-index:1;border-radius:50% 50% 0 0/18% 18% 0 0;background:linear-gradient(180deg,#9de07b 0%,#5cb840 45%,#3f9c2d 100%)}
.grass2{position:fixed;left:-10%;right:-10%;bottom:0;height:17%;z-index:1;border-radius:46% 54% 0 0/24% 24% 0 0;background:linear-gradient(180deg,#7fd45f 0%,#49a731 60%,#368324 100%)}
.flower{position:fixed;z-index:2;font-size:18px;opacity:.95}

/* ========== 场景切换 ========== */
.scene{position:fixed;left:0;top:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;transition:opacity .5s ease,transform .5s ease}
#sceneEnvelope.hide{opacity:0;transform:scale(1.08);pointer-events:none}
#sceneLetter{opacity:0;transform:translateY(40px) scale(.94);pointer-events:none}
#sceneLetter.show{opacity:1;transform:none;pointer-events:auto}

/* ========== 信封 ========== */
.env-wrap{position:relative;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-8px)}}
.envelope{position:relative;width:80vw;max-width:340px;height:56vw;max-height:238px;perspective:700px}
.env-shadow{position:absolute;left:6%;right:6%;bottom:-22px;height:20px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(40,70,20,.35),rgba(40,70,20,0) 72%)}
.env-back{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:14px;background:linear-gradient(160deg,#fff7fa,#ffe1ea 75%);box-shadow:0 10px 24px rgba(90,74,66,.22)}
.env-peek{position:absolute;left:10%;right:10%;top:16%;height:76%;z-index:1;border-radius:8px 8px 4px 4px;background:#fffdf6;background-image:repeating-linear-gradient(180deg,#fffdf6 0 11px,#f6eeda 11px 12px);box-shadow:0 2px 8px rgba(0,0,0,.1);transition:transform .7s cubic-bezier(.34,1.2,.4,1)}
.env-front{position:absolute;left:0;top:0;right:0;bottom:0;z-index:3;border-radius:14px;background:linear-gradient(180deg,#ffeef4 0%,#ffd9e5 100%);clip-path:polygon(0 0,50% 44%,100% 0,100% 100%,0 100%)}
.env-flap{position:absolute;left:0;top:0;right:0;height:52%;z-index:4;border-radius:14px 14px 0 0;background:linear-gradient(180deg,#ffd3e0,#ffb8cb);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .78s cubic-bezier(.4,.1,.2,1);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.env-wrap.opened .env-flap{transform:rotateX(-168deg)}
.env-wrap.opened .env-peek{transform:translateY(-24%)}
.env-wrap.opened .open-btn,.env-wrap.opened .open-tip{opacity:0}
.stamp{position:absolute;right:7%;top:6%;width:34px;height:40px;z-index:5;border-radius:4px;background:#fff;border:2px dashed #ffb3c8;color:#ff6f91;font-size:16px;line-height:36px;text-align:center;transform:rotate(8deg);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.deco{position:absolute;z-index:6;font-size:19px;pointer-events:none}
.d1{left:-16px;top:-18px;font-size:26px;animation:bob 2.6s ease-in-out infinite}
.d2{right:-12px;top:6%;animation:bob 3.4s ease-in-out infinite .4s}
.d3{right:-8px;bottom:-16px;font-size:22px;animation:bob 3s ease-in-out infinite .8s}
.d4{left:-14px;bottom:4%;animation:bob 3.8s ease-in-out infinite .2s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-7px) rotate(6deg)}}

/* ========== 打开按钮 + 小字 ========== */
.open-btn{position:absolute;left:50%;top:52%;z-index:7;width:66px;height:66px;border:none;border-radius:50%;background:radial-gradient(circle at 34% 28%,#ff9db4 0%,#e8386a 66%,#c32757 100%);color:#fff;font-size:26px;line-height:1;cursor:pointer;box-shadow:0 8px 18px rgba(232,56,106,.45),inset 0 -4px 8px rgba(0,0,0,.18);transform:translate(-50%,-50%);animation:beat 1.5s ease-in-out infinite;transition:opacity .35s ease}
@keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}
.open-tip{position:absolute;left:50%;top:52%;margin-top:40px;z-index:7;padding:4px 12px;border-radius:20px;background:#fff;color:#e8386a;font-size:12px;letter-spacing:1px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.15);transform:translateX(-50%);animation:tipUp 1.8s ease-in-out infinite;transition:opacity .35s ease}
@keyframes tipUp{0%,100%{transform:translateX(-50%) translateY(0);opacity:.85}50%{transform:translateX(-50%) translateY(-4px);opacity:1}}

/* ========== 信纸 ========== */
.paper{position:relative;width:88vw;max-width:420px;height:82vh;height:calc(var(--vh,1vh) * 82);max-height:720px;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:#fffdf7;background-image:radial-gradient(rgba(214,188,152,.28) 1px,rgba(0,0,0,0) 1px);background-size:16px 16px;box-shadow:0 22px 44px rgba(30,50,20,.3);border:1px solid #f1e3ce}
.paper:before{content:"";position:absolute;left:0;right:0;top:0;height:9px;z-index:2;background:repeating-linear-gradient(135deg,#ff9db4 0 9px,#ffd9e5 9px 18px)}
.paper-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:30px 24px 22px;-webkit-user-select:text;user-select:text}
.letter-title{margin:0 0 4px;font-size:19px;font-weight:700;text-align:center;color:#e8386a;letter-spacing:1px}
.letter-title:after{content:"";display:block;width:52px;height:2px;margin:9px auto 0;border-radius:2px;background:linear-gradient(90deg,#ffd9e5,#ff9db4,#ffd9e5)}
.letter-date{margin:10px 0 20px;text-align:center;font-size:12px;color:#b3a396}
.letter-body{font-size:15px;line-height:2.05;color:#5a4a42;word-break:break-word}
.letter-body p{margin:0 0 14px;text-indent:2em}
.letter-body p.no-indent{text-indent:0}
.letter-body img{display:block;max-width:100%;margin:10px auto;border-radius:10px}
.letter-sign{margin:24px 0 6px;text-align:right;font-size:14px;line-height:1.95;color:#7d6a5e}
.letter-sign .name{color:#e8386a;font-size:15px}
.close-btn{flex:none;margin:0 24px 18px;padding:12px 0;border:none;border-radius:24px;background:linear-gradient(135deg,#ff9db4,#e8386a);color:#fff;font-size:14px;letter-spacing:2px;cursor:pointer;box-shadow:0 6px 14px rgba(232,56,106,.35)}
.fly{position:absolute;left:50%;top:50%;z-index:8;font-size:16px;color:#ff5c86;pointer-events:none;animation:fly 1.3s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(calc(-50% + var(--x,0px)),calc(-50% - 130px)) scale(1.25)}}
</style>
</head>
<body>

<!-- ================= 背景 ================= -->
<div class="bg">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
</div>
<div class="grass"></div>
<div class="grass2"></div>
<span class="flower" style="left:6%;bottom:5%">🌼</span>
<span class="flower" style="left:24%;bottom:2%">🌿</span>
<span class="flower" style="right:9%;bottom:6%">🌸</span>
<span class="flower" style="right:28%;bottom:2%">🍀</span>

<!-- ================= 场景一：信封 ================= -->
<section id="sceneEnvelope" class="scene">
  <div class="env-wrap" id="envWrap">
    <div class="envelope" id="envelope">
      <div class="env-shadow"></div>
      <div class="env-back"></div>
      <div class="env-peek"></div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="stamp">♥</div>

      <!-- ↓↓↓ 可爱小装饰（改 emoji 就换造型，位置在 CSS 的 .d1~.d4） ↓↓↓ -->
      <span class="deco d1">🎀</span>
      <span class="deco d2">✨</span>
      <span class="deco d3">💗</span>
      <span class="deco d4">🌸</span>
      <!-- ↑↑↑ 可爱小装饰 ↑↑↑ -->

      <!-- 打开按钮（中间的火漆印♥） -->
      <button class="open-btn" id="openBtn" type="button" aria-label="点击此处打开">♥</button>
      <!-- 按钮下方的小字 -->
      <p class="open-tip">点击此处打开</p>
    </div>
  </div>
</section>

<!-- ================= 场景二：信纸 ================= -->
<section id="sceneLetter" class="scene">
  <div class="paper">
    <div class="paper-scroll" id="paperScroll">

      <!-- ▼▼▼▼▼▼  ✏️ 你的信 从这里开始写  ▼▼▼▼▼▼ -->

      <h1 class="letter-title">写给你的一封信</h1>
      <p class="letter-date">2026 年 10 月 20 日</p>

      <div class="letter-body">
        <p>当你看到这封信的时候，应该已经拿到了手机吧，告诉我给你换一封信，是不是特别有仪式感</p>

        <p>期待你的回复</p>

        <!-- 想加图片就取消下一行的注释，并换成你自己的图片地址 -->
        <!-- <img src="图片地址.jpg" alt="照片"> -->
      </div>

      <p class="letter-sign">
        想你的 <span class="name">yzq</span><br>
        2026 年 10月 20 日
      </p>

      <!-- ▲▲▲▲▲▲  ✏️ 你的信 到这一行结束   ▲▲▲▲▲▲ -->

    </div>
    <button class="close-btn" id="closeBtn" type="button">收起信纸</button>
  </div>
</section>

<script>
(function(){
  function fixVH(){ document.documentElement.style.setProperty('--vh',(window.innerHeight*0.01)+'px'); }
  fixVH();
  window.addEventListener('resize',fixVH);
  window.addEventListener('orientationchange',fixVH);

  var envWrap  = document.getElementById('envWrap'),
      envelope = document.getElementById('envelope'),
      sceneE   = document.getElementById('sceneEnvelope'),
      sceneL   = document.getElementById('sceneLetter'),
      openBtn  = document.getElementById('openBtn'),
      closeBtn = document.getElementById('closeBtn'),
      scroll   = document.getElementById('paperScroll'),
      opened   = false;

  function openLetter(){
    if(opened){ return; }
    opened = true;
    envWrap.classList.add('opened');          // 信封盖翻开 + 信纸露头

    for(var i=0;i<8;i++){                     // 飘几颗小爱心
      (function(i){
        var s = document.createElement('span');
        s.className = 'fly';
        s.textContent = (i%2===0 ? '♥' : '✦');
        s.style.setProperty('--x',(Math.random()*180-90)+'px');
        s.style.animationDelay = (i*0.05)+'s';
        sceneE.appendChild(s);
        setTimeout(function(){ if(s.parentNode){ s.parentNode.removeChild(s); } },1800);
      })(i);
    }

    setTimeout(function(){                    // 约 0.5 秒后切到信纸
      sceneE.classList.add('hide');
      sceneL.classList.add('show');
      scroll.scrollTop = 0;
    },480);
  }

  openBtn.addEventListener('click',openLetter);
  envelope.addEventListener('click',openLetter);   // 点信封任意位置也能打开

  closeBtn.addEventListener('click',function(){
    sceneL.classList.remove('show');
    sceneE.classList.remove('hide');
    envWrap.classList.remove('opened');
    opened = false;
  });
})();
</script>
</body>
</html>
